name: update

on:
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: write
  id-token: write
  actions: write


jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - name: Check out standalone repo
      uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      with:
        path: standalone

    - name: Check out Trilinos repo 
      uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      with:
        repository: trilinos/Trilinos
        ref: develop
        path: Trilinos

    - name: Regenerate repo
      run: |
        cd standalone
        rm -rf packages repo.yaml
        cp -r ../trilinos/commonTools/spack_wrappers/* .
        git commit -m "Package updates"
        # git push
